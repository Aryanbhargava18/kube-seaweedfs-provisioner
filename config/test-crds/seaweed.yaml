apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: seaweeds.seaweedfs.com
spec:
  group: seaweedfs.com
  names:
    kind: Seaweed
    listKind: SeaweedList
    plural: seaweeds
    singular: seaweed
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              filer:
                type: object
                x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              masterStatus:
                type: object
                properties:
                  Replicas:
                    type: integer
                  ReadyReplicas:
                    type: integer
    subresources:
      status: {}
