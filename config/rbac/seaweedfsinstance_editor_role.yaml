# This rule is not used by the project kube-seaweedfs-provisioner itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the storage.aryan.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-seaweedfs-provisioner
    app.kubernetes.io/managed-by: kustomize
  name: seaweedfsinstance-editor-role
rules:
- apiGroups:
  - storage.aryan.dev
  resources:
  - seaweedfsinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - storage.aryan.dev
  resources:
  - seaweedfsinstances/status
  verbs:
  - get
