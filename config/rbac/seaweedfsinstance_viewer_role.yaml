# This rule is not used by the project kube-seaweedfs-provisioner itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to storage.aryan.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-seaweedfs-provisioner
    app.kubernetes.io/managed-by: kustomize
  name: seaweedfsinstance-viewer-role
rules:
- apiGroups:
  - storage.aryan.dev
  resources:
  - seaweedfsinstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.aryan.dev
  resources:
  - seaweedfsinstances/status
  verbs:
  - get
